name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The dense gate downloads a ~2.2 GB model, so it runs nightly and on demand.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "embedding model key for the dense gate"
        default: e5
        type: choice
        options: [e5, bge]

env:
  PG_IMAGE: pgvector/pgvector:pg17

jobs:
  ci:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    # Without this the DB-backed tests skip themselves and CI goes green on
    # roughly half the suite. Same image as docker-compose.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_pass
          POSTGRES_DB: rag_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # requirements/ lives under config/; setup-python's default glob is
          # **/requirements.txt, which now matches nothing and errors.
          cache-dependency-path: config/requirements/*.txt

      - run: pip install -r config/requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Audit dependencies
        # Every requirements file, not just the runtime one. config/requirements/models.txt
        # carries torch, sentence-transformers, openai and cohere — the largest
        # dependency surface in the repo — and was previously never scanned.
        run: |
          pip-audit -r config/requirements/base.txt \
                    -r config/requirements/dev.txt \
                    -r config/requirements/models.txt

  # ---------------------------------------------------------------------------
  # Retrieval regression gate.
  #
  # TRADE-OFF (option (a) of the two we considered):
  #   Every PR gates the LEXICAL config, which needs no embedding model — the job
  #   installs config/requirements/dev.txt only, ingests the committed corpus, and
  #   compares recall@10 against evals/baseline.json. That catches regressions in
  #   Arabic normalization, article-boundary chunking, chunk ids, the generated
  #   tsvector and the FTS query — which is where silent breakage actually lives,
  #   because every one of those is shared with the dense path.
  #   It does NOT catch an embedding or fusion regression.
  #
  #   The rejected option (b) was caching multilingual-e5-large in actions/cache
  #   and running the dense gate on every PR. Rejected because a ~2.2 GB restore
  #   (plus a ~2 GB torch install) on every push buys one extra failure mode at
  #   several minutes per run; the dense-only surface is small and changes rarely.
  #   Instead the dense gate runs nightly and on workflow_dispatch, so it is at
  #   most one day between an embedding regression landing and CI saying so.
  #
  # Both jobs must be able to FAIL: they ingest a real corpus and re-run the
  # harness. If ingestion produces zero chunks the gate reports recall@10 0.0000
  # and exits 1 rather than reporting a vacuous pass.
  # ---------------------------------------------------------------------------
  eval-gate-lexical:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_pass
          POSTGRES_DB: rag_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://rag_user:rag_pass@localhost:5433/rag_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # requirements/ lives under config/; setup-python's default glob is
          # **/requirements.txt, which now matches nothing and errors.
          cache-dependency-path: config/requirements/*.txt

      - run: pip install -r config/requirements/dev.txt

      - name: Migrate
        run: alembic -c config/alembic.ini upgrade head

      - name: Ingest the committed corpus
        run: python -m ingestion ingest

      - name: Corpus sanity check
        run: python -m ingestion stats

      - name: Gate — lexical recall@10 vs evals/baseline.json
        run: python -m evals.gate --config lexical

  eval-gate-dense:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_pass
          POSTGRES_DB: rag_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://rag_user:rag_pass@localhost:5433/rag_db
      MODEL_KEY: ${{ inputs.model || 'e5' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # requirements/ lives under config/; setup-python's default glob is
          # **/requirements.txt, which now matches nothing and errors.
          cache-dependency-path: config/requirements/*.txt

      # The default linux torch wheel is the CUDA build (~2.5 GB) and this runner
      # has no GPU, so pin the CPU index first and let config/requirements/models.txt
      # resolve against the wheel already installed.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r config/requirements/dev.txt -r config/requirements/models.txt

      # Weights are immutable per model id, so the key never needs to change.
      # The cache holds the embedding model AND BAAI/bge-reranker-v2-m3, which the
      # latency replay's informational step pulls — hence the suffix.
      - name: Cache HuggingFace weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ env.MODEL_KEY }}-plus-reranker-v2-m3

      - name: Migrate
        run: alembic -c config/alembic.ini upgrade head

      - name: Ingest the committed corpus
        run: python -m ingestion ingest

      - name: Backfill embeddings
        run: python -m ingestion backfill --model "$MODEL_KEY"

      - name: Gate — dense recall@10 vs evals/baseline.json
        run: python -m evals.gate --config dense --model "$MODEL_KEY"

      # -----------------------------------------------------------------------
      # Latency budget replay. Nightly only, and only here: it needs pgvector,
      # the ingested corpus and the embedding weights that this job has already
      # paid for. Putting it on the PR job would mean a ~2.2 GB model download
      # per push to gate a wall-clock number.
      #
      # WHY THIS GATES `hybrid` AND NOT THE SHIPPED `hybrid+rerank`, measured
      # rather than assumed. Re-running the same replay on this repo's dev host
      # with MPS forced off (torch.backends.mps.is_available -> False), 30
      # questions, bge, identical corpus:
      #
      #   stage      MPS p95    CPU p95    allocation
      #   embed       32.8 ms    53.7 ms      120 ms   ok on both
      #   retrieve    14.0 ms    13.4 ms       60 ms   Postgres-bound, unchanged
      #   rerank     933.1 ms  3972.4 ms     1200 ms   CPU is 4.3x over budget
      #
      # The 1200 ms rerank allocation was derived on Apple Silicon. A GitHub
      # runner has no GPU and fewer cores than the machine measured above, so
      # gating hybrid+rerank here would paint this job red every single night for
      # a reason that is not a regression — and a permanently red gate is a
      # disabled gate. So the gating step drops the cross-encoder and enforces the
      # stages that CPU does not change by an order of magnitude; the full config
      # runs immediately after as a recorded, non-gating measurement.
      #
      # BUDGET in benchmark/replay.py is deliberately NOT widened to fit CPU. The
      # honest fix, the day this service actually runs on CPU-only Cloud Run, is
      # to re-derive the rerank allocation from CPU numbers in its own commit —
      # or to stop shipping the cross-encoder there. terraform/README.md ranks
      # this as the second thing expected to break on deploy.
      # -----------------------------------------------------------------------
      - name: Latency replay — plan/embed/cache/retrieve/fuse p95 vs BUDGET
        run: python -m benchmark.replay --n 30 --config hybrid --model "$MODEL_KEY"

      # Informational: records what the cross-encoder costs without a GPU, which
      # is the number the Cloud Run deployment story is missing. Expected to exit
      # 1; read the printed p95, do not treat a failure here as a broken build.
      - name: Latency replay — full hybrid+rerank on CPU (recorded, not gating)
        continue-on-error: true
        run: python -m benchmark.replay --n 30 --config hybrid+rerank --model "$MODEL_KEY"
