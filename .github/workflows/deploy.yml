name: Deploy

# Build the image on a native amd64 runner, push it to Artifact Registry, roll a
# Cloud Run revision. Infrastructure is NOT touched: `terraform apply` stays on a
# laptop because the state is local (terraform/versions.tf has no backend), and a
# CI apply against no shared state would either fight that state or silently
# recreate things. This workflow deploys code, not infra.
#
# Auth is keyless via Workload Identity (terraform/github_oidc.tf). There is no
# service-account JSON key in this repository or in GitHub secrets, by design.
#
# Manual trigger only. A public URL that redeploys itself on every push to main is
# a way to break a live demo while someone is watching it.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment to deploy to"
        default: production
        type: environment

permissions:
  contents: read
  id-token: write # the OIDC token; without this the auth step has nothing to trade

concurrency:
  # One deploy at a time, newest wins: dispatching again supersedes a deploy still
  # in flight rather than queueing behind it, so the last dispatch is what runs.
  # An interrupted run can leave a half-pushed image in Artifact Registry —
  # harmless, the next push resumes the missing layers — and `gcloud run services
  # update` is server-side, so a revision either rolls out or does not.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environment gates live here: protection rules and required reviewers are
    # configured on the GitHub environment, not in this file.
    environment: ${{ inputs.environment }}

    # No defaults, deliberately. Every value comes from the environment's `vars`,
    # and the guard step below fails the run if any is unset. A fallback baked into
    # this file is how a deploy aimed at a new environment silently lands in the
    # old project instead — the failure mode is worse than a red run.
    #
    # None of these are secrets: a Workload Identity provider path and a service
    # account email are public-safe. What stops another repository using them is
    # the provider's attribute_condition (terraform/github_oidc.tf).
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

    steps:
      # First, before anything costs a minute of runner time. An unset `vars` entry
      # interpolates to an empty string, so without this the run reaches
      # `--region ""` and fails somewhere far from the cause.
      - name: Require environment configuration
        # The input goes through env, not straight into the script: interpolating
        # a workflow input into a `run` body is the shape of a shell injection.
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION SERVICE_NAME \
                      WORKLOAD_IDENTITY_PROVIDER DEPLOYER_SERVICE_ACCOUNT; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            printf 'Missing variables on environment "%s": %s\n' \
              "$ENVIRONMENT" "${missing[*]}" >&2
            echo 'Set them under Settings -> Environments -> variables.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      # The image carries torch plus a baked 2.3 GB embedding model. A default
      # ubuntu runner has enough disk only after the preinstalled toolchains go.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      # Its own step because a job-level `env` entry cannot reference the others.
      - name: Resolve the image path
        run: |
          echo "IMAGE=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$SERVICE_NAME/$SERVICE_NAME" \
            >> "$GITHUB_ENV"

      # Two tags for one build: the sha is what gets deployed and is what a
      # rollback names, and `latest` is what terraform/run.tf references, so a
      # later `terraform apply` does not drag the service back to an older image.
      - name: Build and push
        run: |
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy the revision
        run: |
          # --container is not optional here, it is the whole safety property.
          # The service runs two containers (app + the Managed Prometheus
          # collector, terraform/prometheus.tf). An unscoped --image resolves to
          # whichever container has a ports block, which today is `app` only
          # because the collector deliberately has none — name the target rather
          # than inherit that. Non-container flags must precede --container.
          gcloud run services update "$SERVICE_NAME" \
            --region "$GCP_REGION" \
            --container app \
            --image "$IMAGE:${{ github.sha }}"

      # Fails the job if the new revision is not serving. Without this the deploy
      # is "gcloud exited 0", which is not the same as "the service works".
      - name: Smoke test
        # `shell: bash` for the pipefail it brings. The default shell is `bash -e`
        # with no pipefail, so `curl -fsS "$url/stats" | head -c 400` exited with
        # head's 0 and a /stats returning 500 could not fail this step — the same
        # trap ci.yml already fixed on its tee pipelines.
        shell: bash
        run: |
          url=$(gcloud run services describe "$SERVICE_NAME" \
                  --region "$GCP_REGION" --format='value(status.url)')
          echo "deployed: $url"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url/health"
          curl -fsS "$url/stats" | head -c 400

      # /health passes whether or not the collector survived the update, so a
      # deploy that dropped the sidecar would look green and go quiet instead of
      # red. If the sidecar is intentionally off (enable_prometheus_sidecar =
      # false in terraform), this step is what you delete — not the --container
      # flag above.
      #
      # The whole set, not just "is collector present". `gcloud run services
      # update --container NAME` ADDS a container when nothing of that name
      # exists, so deploying against a service whose app container is unnamed or
      # renamed grafts a second, portless container called `app` carrying the new
      # image while the original keeps serving the old code — and /health, the
      # collector check and the Summary all stay green over stale code. An exact
      # match is the only assertion that catches that.
      - name: Container set is exactly app + collector
        shell: bash
        run: |
          containers=$(gcloud run services describe "$SERVICE_NAME" \
                         --region "$GCP_REGION" \
                         --format='value(spec.template.spec.containers[].name)')
          echo "containers: $containers"
          echo "CONTAINERS=$containers" >> "$GITHUB_ENV"
          names=$(echo "$containers" | tr ';' ' ' | xargs -n1 | sort | paste -sd, -)
          if [[ "$names" != "app,collector" ]]; then
            echo "::error::expected containers app,collector — got ${names:-none}"
            exit 1
          fi

      # if: always() — a failed deploy is when you most need to know which sha
      # was aimed at which project, and whether it got as far as serving.
      - name: Summary
        if: always()
        shell: bash
        run: |
          url=$(gcloud run services describe "$SERVICE_NAME" \
                  --region "$GCP_REGION" --format='value(status.url)' 2>/dev/null || true)
          revision=$(gcloud run services describe "$SERVICE_NAME" \
                       --region "$GCP_REGION" \
                       --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)
          {
            echo "## deploy — ${{ inputs.environment }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| result | ${{ job.status }} |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| image | \`$IMAGE:${{ github.sha }}\` |"
            echo "| project · region | \`$GCP_PROJECT_ID\` · \`$GCP_REGION\` |"
            echo "| serving revision | \`${revision:-unknown}\` |"
            echo "| containers | \`${CONTAINERS:-not reached}\` |"
            echo "| url | ${url:-unknown} |"
            echo
            echo "Roll back with:"
            echo '```'
            echo "gcloud run services update $SERVICE_NAME --region $GCP_REGION \\"
            echo "  --container app --image $IMAGE:<previous-sha>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
