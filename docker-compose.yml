services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://rag_user:rag_pass@db:5432/rag_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_pass
      - POSTGRES_DB=rag_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates rag_test next to rag_db. Without it `pytest` skips 170 tests and
      # still exits 0 — see the comment in the file.
      - ./config/init-rag-test-db.sql:/docker-entrypoint-initdb.d/01-rag-test.sql:ro

  jaeger:
    ## Three-part tag: jaeger stopped publishing the short `1.62` alias after 1.60,
    ## so `:1.62` is not a tag and the pull fails with "not found".
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  postgres_data:
